seed: 13
device: auto

retrieval:
  bm25_k1: 1.2
  bm25_b: 0.75
  depth: 100
  rrf_k: 60
  dense_model: BAAI/bge-small-en-v1.5
  candidate_sizes: [10, 20, 50, 100]

evaluation:
  cutoff: 10
  bootstrap_resamples: 10000
  reference_model: bge-v2-m3
  baseline: no-reranker

timing:
  warmup_queries: 3
  queries_per_cell: 25

datasets:
  scifact:
    label: SciFact
    source: beir
    binary_threshold: 1
  nfcorpus:
    label: NFCorpus
    source: beir
    binary_threshold: 1
  trec-dl-2019:
    label: TREC-DL 2019
    source: trec
    year: 2019
    binary_threshold: 2
  trec-dl-2020:
    label: TREC-DL 2020
    source: trec
    year: 2020
    binary_threshold: 2

longcontext:
  sample_queries: 40
  candidates: 20
  lengths: [512, 1024, 2048, 4096, 8192]
  models: [laya-multi, qwen3-06b, jina-v2, bge-v2-m3]

cascade:
  pool: 50
  timing_queries: 14
  top_k: [5, 10, 20, 50]
  decision: [laya-en, laya-multi, laya-td]
  refiner: [bge-v2-m3, qwen3-06b, jina-v2]

stability:
  dataset: scifact
  queries: 60
  candidates: 20
  perturbations: 5
  kinds: [typos, synonyms, paraphrase]

prompts:
  datasets: [scifact, nfcorpus]
  queries: 100
  candidates: 20

models:
  laya-en:
    kind: decision
    label: Laya-EN
    family: laya
    repo: convaiinnovations/laya
    allow: [config.json, rl_agent_config.json, model.safetensors, encoder/*, tokenizer/*]
    params_m: 421
    context: 512
    batch: 32
  laya-multi:
    kind: decision
    label: Laya-Multi
    family: laya
    repo: convaiinnovations/laya-multilingual
    allow: ["*.json", model.safetensors, tokenizer/*, encoder/*]
    params_m: 322
    context: 8192
    batch: 16
  laya-td:
    kind: decision
    label: Laya-TD
    family: laya
    repo: convaiinnovations/laya-typed-decisions
    allow: ["*.json", model.safetensors, tokenizer/*, encoder/*]
    params_m: 421
    context: 1024
    batch: 32
  bge-v2-m3:
    kind: cross
    backend: sbert
    label: BGE-v2-m3
    family: bge
    repo: BAAI/bge-reranker-v2-m3
    allow: ["*.json", model.safetensors, sentencepiece.bpe.model]
    params_m: 568
    context: 512
    batch: 32
  bge-base:
    kind: cross
    backend: sbert
    label: BGE-base
    family: bge
    repo: BAAI/bge-reranker-base
    allow: ["*.json", model.safetensors, sentencepiece.bpe.model]
    params_m: 278
    context: 512
    batch: 64
  qwen3-06b:
    kind: cross
    backend: qwen
    label: Qwen3-0.6B
    family: qwen
    repo: Qwen/Qwen3-Reranker-0.6B
    allow: ["*.json", model.safetensors, vocab.json, merges.txt]
    params_m: 600
    context: 32768
    batch: 16
  jina-v2:
    kind: cross
    backend: jina
    label: Jina-v2
    family: jina
    repo: jinaai/jina-reranker-v2-base-multilingual
    allow: ["*.json", "*.py", model.safetensors]
    params_m: 278
    context: 1024
    batch: 32
  minilm:
    kind: cross
    backend: sbert
    label: MiniLM-L6
    family: minilm
    repo: cross-encoder/ms-marco-MiniLM-L6-v2
    allow: ["*.json", model.safetensors, vocab.txt]
    params_m: 22
    context: 512
    batch: 128

support_models:
  bge-small:
    repo: BAAI/bge-small-en-v1.5
    allow: ["*.json", model.safetensors, vocab.txt, 1_Pooling/*]
  paraphraser:
    repo: Qwen/Qwen2.5-1.5B-Instruct
    allow: ["*.json", model.safetensors, vocab.json, merges.txt]
