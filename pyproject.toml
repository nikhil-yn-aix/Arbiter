[project]
name = "decision-rerank"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch",
    "transformers>=4.51,<5",
    "sentence-transformers>=3.0",
    "laya==0.4.1",
    "bm25s",
    "pystemmer",
    "numpy",
    "scipy",
    "pandas",
    "pydantic",
    "pyyaml",
    "huggingface-hub",
    "pyarrow",
    "matplotlib",
    "tqdm",
    "einops",
    "pillow",
    "nltk>=3.10.3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_rerank"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
